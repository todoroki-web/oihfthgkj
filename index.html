<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✅ оплата</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emoji {
            font-size: min(70vw, 70vh);
            line-height: 1;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s ease;
        }
        .emoji:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="emoji" id="payButton">✅</div>

    <script>
        const btn = document.getElementById('payButton');
        const sound = new Audio();
      
        sound.src = 'https://www.myinstants.com/media/sounds/apple-pay.mp3';
        
        sound.preload = 'auto';

        function playSound() {
            sound.currentTime = 0;
            sound.play().catch(() => {
                console.log('Звук не загрузился, проверь ссылку');
            });
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }
        }

        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            playSound();
        });

        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            playSound();
        }, { passive: false });
    </script>
</body>
</html>
