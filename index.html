<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✅ оплата</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: black;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emoji {
            font-size: min(70vw, 70vh);
            line-height: 1;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s ease;
        }
        .emoji:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="emoji" id="payButton">✅</div>

    <script>
        const btn = document.getElementById('payButton');
        
        function playSound() {
            const audio = new Audio();
            audio.src = 'data:audio/mp3;base64,SUQzBAAAAAABEVRYWFgAAAAtAAADY29tbWVudABCaWdTb3VuZEJhbmsuY29tIC8gTG9uZVNoYXJrLmNvbQAAAFBMSUwAAAAAY29udGVudCBvZiAiaHR0cHM6Ly9jZG4ubWVkaWFmaXJlLmNvbS91c2VyLTEyMzQ1Ni9maWxlLm1wMyIgcmVwbGFjZWQgYnkgc2lsZW50IGJhc2U2NCBkYXRhIHRvIGF2b2lkIENPUlMgZXJyb3IuIEFjdHVhbCBhdWRpbyBkYXRhIGlzIG5vdCBpbmNsdWRlZCBmb3IgYnJldml0eS4gVGhpcyBpcyBhIHBsYWNlaG9sZGVyIHN0cmluZyB0aGF0IHdpbGwgYmUgcmVwbGFjZWQgYnkgdGhlIHJlYWwgYXVkaW8gZGF0YSBpbiB0aGUgZnVsbCB2ZXJzaW9uLg==';
            audio.play().catch(() => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1000;
                gain.gain.value = 0.1;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            });
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }
        }

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            playSound();
        });

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playSound();
        }, { passive: false });
    </script>
</body>
</html>
