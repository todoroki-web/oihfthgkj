<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✅ оплата</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        .emoji {
            font-size: min(70vw, 70vh);
            line-height: 1;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }
        .emoji:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji" id="payButton">✅</div>
    </div>

    <audio id="paymentSound" preload="auto" style="display: none;">
        <source src="https://audio.jukehost.co.uk/76yGjlPwVDqBieRvLihTpSzLpNnYpMqP" type="audio/mpeg">
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('payButton');
        const sound = document.getElementById('paymentSound');

        function playSound() {
            sound.pause();
            sound.currentTime = 0;
            
            const playPromise = sound.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log('Браузер заблокировал звук, используем Web Audio');
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        
                        const playWebAudio = () => {
                            const osc = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = 880;
                            gainNode.gain.value = 0.2;
                            osc.connect(gainNode).connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.15);
                        };

                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume().then(playWebAudio).catch(() => {});
                        } else {
                            playWebAudio();
                        }
                    } catch (webAudioErr) {
                        console.log('Web Audio API не сработал');
                    }
                });
            }
            
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }
        }

        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            playSound();
        });

        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            playSound();
        }, { passive: false });

        btn.addEventListener('touchend', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
